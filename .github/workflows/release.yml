name: Release

# GitHub Release を公開したら .deb を作って添付する（rproxy-api の apt リポジトリがここから取る）。
# 手順は docs/RELEASING.md。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 添付するリリースのタグ（vX.Y.Z）
        required: true

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag and package.json agree
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::release $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: scripts/build-deb.sh dist
      - name: Attach to the release
        run: gh release upload "$TAG" dist/*.deb --clobber
