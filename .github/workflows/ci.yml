name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 実行環境は Alpine のコンテナ。Node.js は公式の node:24-alpine（メジャー版を指定する。README の NODE_MAJOR=24 と同じ）。
# Debian を使うのは .deb を作って入れて確かめる deb ジョブだけ（debian:trixie-slim、nodejs は NodeSource の 24）。

jobs:
  check:
    name: typecheck + lint + unit tests + build
    runs-on: ubuntu-latest
    container: node:24-alpine
    steps:
      - run: apk add --no-cache git shellcheck
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: shellcheck
        run: shellcheck scripts/*.sh contrib/keepalived/*.sh packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm
      - run: npm test
      - run: npm run build

  # コンテナイメージ（Dockerfile。charts/rproxy-ui が使う）：作って、ルートを読むだけにして起動し、/api/healthz が答えること。
  # PR では push しない（release.yml がタグで ghcr.io/max3584/rproxy-ui に amd64・arm64 を push する）
  image:
    name: container image (build, run read-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: rproxy-ui:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: run with a read-only root file system
        run: |
          docker run -d --name ui --read-only --tmpfs /tmp --tmpfs /app/.next/cache:uid=65532,gid=65532 \
            --cap-drop ALL --security-opt no-new-privileges -p 3000:3000 rproxy-ui:ci
          for i in $(seq 1 30); do
            if out=$(curl -sf http://127.0.0.1:3000/api/healthz); then echo "$out"; break; fi
            sleep 1
          done
          test "$out" = '{"ok":true}'
          test "$(docker inspect -f '{{.Config.User}}' rproxy-ui:ci)" = 65532:65532
          # migrate.mjs finds the driver in the image (and then fails to connect: no DB here)
          docker run --rm --read-only -e DB_HOST=127.0.0.1 -e DB_DATABASE=x rproxy-ui:ci node db/migrate.mjs > migrate.log 2>&1 || true
          cat migrate.log
          grep -q 'ECONNREFUSED\|connect' migrate.log
          if grep -q 'ドライバが見つかりません' migrate.log; then exit 1; fi
          # no native modules, no build-time secrets
          test -z "$(docker run --rm rproxy-ui:ci find /app -name '*.node' -o -name '.env*' | head -1)"
      - name: logs
        if: always()
        run: docker logs ui || true

  # Helm chart（charts/rproxy-ui）：lint と、値の組ごとに helm template + kubeconform
  chart:
    name: helm chart (lint, template, kubeconform)
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      - run: apk add --no-cache git curl tar helm jq
      - uses: actions/checkout@v7
      - name: kubeconform
        run: curl -sfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
      - name: chart version = package.json version
        run: |
          v=$(jq -r .version package.json)
          grep -qx "version: $v" charts/rproxy-ui/Chart.yaml
          grep -qx "appVersion: \"$v\"" charts/rproxy-ui/Chart.yaml
      - name: lint, template, kubeconform
        run: |
          set -e
          for f in charts/rproxy-ui/ci/*.yaml; do
            echo "== $f"
            helm lint --strict charts/rproxy-ui -f "$f"
            helm template ui charts/rproxy-ui -f "$f" > "$RUNNER_TEMP/out.yaml"
            kubeconform -strict -summary -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "$RUNNER_TEMP/out.yaml"
          done
          # values without the required ones are refused
          if helm template ui charts/rproxy-ui >/dev/null 2>&1; then echo "rendered without existingSecret/url"; exit 1; fi

  # .deb の作成と確かめは Debian が対象そのものなので、debian:trixie-slim（Debian 13）で動かす。
  # test-deb.sh は systemd（systemctl enable --now、journalctl）が要り、ジョブのコンテナでは systemd を PID 1 にできないので、
  # ランナーの docker で systemd を init にしたコンテナを起こし、その中で作って入れる。
  # nodejs はディストリのもの（Debian 13 は 20）ではなく、README と同じ手順で NodeSource の 24 を入れる（scripts/install-nodejs.sh）。
  deb:
    name: Debian package (install, start, purge)
    runs-on: ubuntu-latest
    env:
      NODE_MAJOR: 24
    steps:
      - uses: actions/checkout@v7
      - name: debian:trixie-slim with systemd and nodejs ${{ env.NODE_MAJOR }} from NodeSource
        run: |
          docker run --name deb-prep -e NODE_MAJOR -v "$PWD/scripts/install-nodejs.sh:/install-nodejs.sh:ro" debian:trixie-slim sh -ec '
            # undo what the image does for image builds, so the package behaves as on an installed system:
            # dpkg skipping /usr/share/doc (test-deb.sh checks files there) and policy-rc.d refusing to start or stop services
            rm -f /etc/dpkg/dpkg.cfg.d/* /usr/sbin/policy-rc.d
            apt-get update
            apt-get install -y --no-install-recommends systemd systemd-sysv sudo curl ca-certificates iproute2 procps
            /install-nodejs.sh
            apt-get clean'
          docker commit --change 'CMD ["/sbin/init"]' deb-prep rproxy-deb-test
          docker run -d --name deb --privileged --cgroupns=private -e container=docker -v "$PWD:/src" -w /src rproxy-deb-test
          docker exec deb sh -c 'systemctl is-system-running --wait || true'
      - name: scripts/build-deb.sh
        run: docker exec deb sh -ec 'npm ci; scripts/build-deb.sh dist'
      - name: scripts/test-deb.sh
        run: docker exec deb sh -ec 'scripts/test-deb.sh dist/*.deb'

  e2e:
    name: e2e (MariaDB + rproxy-api)
    runs-on: ubuntu-latest
    container: node:24-alpine
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rproxy_e2e
      DB_USER: root
      DB_PASSWORD: root
      RPROXY_API_URL: http://127.0.0.1:8080
      RPROXY_API_TOKEN: e2e-token
      E2E_BACKEND_PORT: 19001
    steps:
      # build-base・rustup は rproxy-api のビルド、chromium は Playwright（Alpine の musl 向けのブラウザは Playwright が配らない）、openssl は TLS を終端するテストの自己署名の証明書、
      # pebble は ACME の試験用の CA（tests/ui/acme.spec.ts。scripts/ci-pebble.sh）
      - run: apk add --no-cache git bash curl build-base rustup mariadb mariadb-client chromium openssl pebble
      - uses: actions/checkout@v7

      # rproxy-api と同じ名前のブランチがあればそれを、なければ既定ブランチを使う
      - name: pick rproxy-api ref
        id: rproxy
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/max3584/rproxy-api.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          repository: max3584/rproxy-api
          ref: ${{ steps.rproxy.outputs.ref }}
          path: rproxy-api
      - name: Rust (stable, musl)
        run: |
          rustup-init -y --profile minimal --default-toolchain stable --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rproxy-api
      - name: build rproxy-api (${{ steps.rproxy.outputs.ref }})
        run: cargo build --manifest-path rproxy-api/Cargo.toml

      # MariaDB は Alpine のパッケージを同じコンテナで動かす（公式の mariadb イメージは Ubuntu が元）
      - name: MariaDB
        run: scripts/ci-mariadb.sh "$DB_DATABASE" "$DB_PASSWORD"

      - run: npm ci

      # 表は db/migrate.mjs で作る（Kubernetes の chart の migration の Job と同じ。空の DB なので schema.sql を流す）
      - name: create tables with db/migrate.mjs
        env:
          DB_ADMIN_USER: root
          DB_ADMIN_PASSWORD: root
        run: |
          node db/migrate.mjs
          # 2 回目は何もしない
          node db/migrate.mjs | tee "$RUNNER_TEMP/migrate-again.log"
          grep -q '当てるものはありません' "$RUNNER_TEMP/migrate-again.log"

      - name: db/migrate.mjs (concurrent runs, an app user, --baseline on a hand-migrated DB)
        env:
          DB_ADMIN_USER: root
          DB_ADMIN_PASSWORD: root
        run: |
          set -e
          # 3 つ同時に動かしても、表を作るのは 1 つだけ（GET_LOCK）。UI のユーザーには DML だけ
          for i in 1 2 3; do
            DB_DATABASE=migrate_conc DB_APP_USER=rproxy_ui_ci DB_APP_PASSWORD=ci-pw node db/migrate.mjs --create-database > "$RUNNER_TEMP/m$i.log" 2>&1 &
          done
          wait
          cat "$RUNNER_TEMP"/m?.log
          test "$(grep -l 'schema.sql を流します' "$RUNNER_TEMP"/m?.log | wc -l)" = 1
          test "$(mariadb -uroot -p"$DB_PASSWORD" -N migrate_conc -e 'SELECT COUNT(*) FROM schema_migrations')" = "$(ls db/migrations/*.sql | wc -l)"
          mariadb -h127.0.0.1 -urproxy_ui_ci -pci-pw migrate_conc -e "INSERT INTO forward_rules (auth_id, protocol, src_addr, src_port, dist_addr, dist_port) VALUES ('ci', 'tcp', '0.0.0.0', 1, '192.0.2.1', 1)"
          if mariadb -h127.0.0.1 -urproxy_ui_ci -pci-pw migrate_conc -e 'DROP TABLE forward_rules' 2>/dev/null; then echo "the UI user may DROP"; exit 1; fi
          # .deb で手で 001・002 まで当てた DB：--baseline がなければ断り、あれば残りを当てる
          mariadb -uroot -p"$DB_PASSWORD" -e 'CREATE DATABASE migrate_old'
          mariadb -uroot -p"$DB_PASSWORD" migrate_old < db/migrations/001_initial.sql
          mariadb -uroot -p"$DB_PASSWORD" migrate_old < db/migrations/002_source_ip_udp_idle.sql
          if DB_DATABASE=migrate_old node db/migrate.mjs; then echo "an old DB without --baseline was migrated"; exit 1; fi
          DB_DATABASE=migrate_old node db/migrate.mjs --baseline 2
          DB_DATABASE=migrate_old node db/migrate.mjs --status
          mariadb -uroot -p"$DB_PASSWORD" -N migrate_old -e "SELECT method FROM schema_migrations WHERE version LIKE '003%'" | grep -qx skipped

      # ACME（rproxy-api v0.3.21。docs/ACME.md がある版だけ）：Pebble を動かし、rproxy の設定ファイルに global.acme を書く
      - name: Pebble (ACME test CA) and global.acme
        run: |
          if [ -f rproxy-api/docs/ACME.md ]; then
            config=$(scripts/ci-pebble.sh "$RUNNER_TEMP/pebble")
            echo "RPROXY_CONFIG=$config" >> "$GITHUB_ENV"
            echo "UI_E2E_ACME=1" >> "$GITHUB_ENV"
          else
            echo "rproxy-api has no ACME; skipping tests/ui/acme.spec.ts"
          fi

      - name: start rproxy-api
        run: |
          echo "$RPROXY_API_TOKEN" > "$RUNNER_TEMP/tokens"
          RPROXY_API_PORT=8080 RPROXY_TOKEN_FILE="$RUNNER_TEMP/tokens" \
          RPROXY_DATABASE_URL="mysql://$DB_USER:$DB_PASSWORD@$DB_HOST:$DB_PORT/$DB_DATABASE" \
            nohup rproxy-api/target/debug/rproxy-api > "$RUNNER_TEMP/rproxy.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/rproxy.log"; exit 1

      - name: e2e tests
        run: RUN_E2E=1 npx vitest run tests/e2e.test.ts

      # 画面操作（tests/ui）: 同じ MariaDB と rproxy-api を使う。ブラウザは Alpine の chromium（playwright.config.ts）
      - run: npm run build
      - name: UI tests (Playwright)
        run: PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(command -v chromium-browser || command -v chromium)" npx playwright test
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

      - name: rproxy-api log
        if: always()
        run: cat "$RUNNER_TEMP/rproxy.log" || true

      - name: Pebble log
        if: always()
        run: cat "$RUNNER_TEMP/pebble/pebble.log" 2>/dev/null || true

  # 複数のノード（#98）：rproxy-api を 2 台（それぞれ別のコンテナ。同じ待ち受けを両方で使えるように）動かし、
  # ノードごとのデータベースのビュー（db/node-view.mjs）から起動時に自分のルールだけを戻すことを確かめる。
  # ノードのコンテナはランナーの docker（ジョブのコンテナに docker.sock が渡る）で、ジョブと同じネットワークに起こす。
  # ソケットと rproxy-api の実行ファイルは、ランナーとジョブのコンテナで同じパスになる /tmp/rproxy-e2e でやりとりする
  e2e-nodes:
    name: e2e (two rproxy nodes + group)
    runs-on: ubuntu-latest
    container:
      image: node:24-alpine
      volumes:
        - /tmp/rproxy-e2e:/tmp/rproxy-e2e
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rproxy_e2e
      DB_USER: root
      DB_PASSWORD: root
      E2E_DIR: /tmp/rproxy-e2e
    steps:
      - run: apk add --no-cache git bash curl build-base rustup mariadb mariadb-client docker-cli
      - uses: actions/checkout@v7

      - name: pick rproxy-api ref
        id: rproxy
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/max3584/rproxy-api.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          repository: max3584/rproxy-api
          ref: ${{ steps.rproxy.outputs.ref }}
          path: rproxy-api
      - name: Rust (stable, musl)
        run: |
          rustup-init -y --profile minimal --default-toolchain stable --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rproxy-api
      - name: build rproxy-api (${{ steps.rproxy.outputs.ref }})
        run: cargo build --manifest-path rproxy-api/Cargo.toml

      - name: MariaDB
        run: scripts/ci-mariadb.sh "$DB_DATABASE" "$DB_PASSWORD"

      - run: npm ci

      - name: create tables from db/schema.sql
        run: mariadb -uroot -p"$DB_PASSWORD" "$DB_DATABASE" < db/schema.sql

      - name: create the per-node databases and views (db/node-view.mjs)
        run: |
          for n in n1 n2; do
            node db/node-view.mjs "$n" --database rproxy_e2e --host '%' --password "pw-$n"
          done | tee /dev/stderr | mariadb -uroot -p"$DB_PASSWORD"

      # ノードのコンテナは node:24-alpine（ジョブのイメージで、ランナーに取ってある）に iproute2（VIP の付け外し）を足したもの。
      # VIP を付け外しするので NET_ADMIN を与える。MariaDB にはジョブのコンテナのアドレスでつなぐ
      - name: start two rproxy-api nodes (Unix sockets)
        run: |
          docker run --name rproxy-node-prep node:24-alpine apk add --no-cache iproute2
          docker commit --change 'ENTRYPOINT []' rproxy-node-prep rproxy-e2e-node
          docker rm rproxy-node-prep
          db_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "${{ job.container.id }}")
          install -m 0755 rproxy-api/target/debug/rproxy-api "$E2E_DIR/rproxy-api"
          for n in n1 n2; do
            mkdir -p "$E2E_DIR/$n"
            echo "token-$n" > "$E2E_DIR/$n/tokens"
            docker run -d --name "rproxy-$n" --network "${{ job.container.network }}" --cap-add NET_ADMIN \
              -v "$E2E_DIR/rproxy-api:/usr/local/bin/rproxy-api:ro" -v "$E2E_DIR/$n:/run/rproxy" \
              -e RPROXY_API_PORT=0 -e RPROXY_API_SOCKET=/run/rproxy/api.sock -e RPROXY_TOKEN_FILE=/run/rproxy/tokens \
              -e RPROXY_DATABASE_URL="mysql://rproxy_$n:pw-$n@$db_ip:3306/rproxy_node_$n" \
              rproxy-e2e-node rproxy-api
          done
          cat > "$E2E_DIR/nodes.yaml" <<YAML
          nodes:
            - name: n1
              url: unix:$E2E_DIR/n1/api.sock
              token_file: $E2E_DIR/n1/tokens
            - name: n2
              url: unix:$E2E_DIR/n2/api.sock
              token_file: $E2E_DIR/n2/tokens
          groups:
            - name: ha
              nodes: [n1, n2]
              mode: active_standby
              vip: 10.99.0.10
          YAML
          echo "RPROXY_UI_NODES=$E2E_DIR/nodes.yaml" >> "$GITHUB_ENV"
          for n in n1 n2; do
            ok=
            for i in $(seq 1 30); do
              if curl -sf --unix-socket "$E2E_DIR/$n/api.sock" http://localhost/healthz; then ok=1; break; fi
              sleep 1
            done
            if [ -z "$ok" ]; then docker logs "rproxy-$n"; exit 1; fi
          done

      - name: e2e tests (nodes)
        run: RUN_E2E_NODES=1 E2E_NODE_CONTAINERS=n1=rproxy-n1,n2=rproxy-n2 npx vitest run tests/e2e-nodes.test.ts

      - name: rproxy-api logs
        if: always()
        run: |
          docker logs rproxy-n1 || true
          docker logs rproxy-n2 || true
