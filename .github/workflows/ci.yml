name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + lint + unit tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deb:
    name: Debian package (install, start, purge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: shellcheck
        run: shellcheck scripts/*.sh packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm
      # the package depends on nodejs (>= 20.18.1); Ubuntu 24.04 ships 18, so use NodeSource as users would
      - name: nodejs from NodeSource
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y nodejs
      - run: scripts/build-deb.sh dist
      - name: scripts/test-deb.sh
        run: scripts/test-deb.sh dist/*.deb

  e2e:
    name: e2e (MariaDB + rproxy-api)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: rproxy_e2e
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rproxy_e2e
      DB_USER: root
      DB_PASSWORD: root
      RPROXY_API_URL: http://127.0.0.1:8080
      RPROXY_API_TOKEN: e2e-token
      E2E_BACKEND_PORT: 19001
    steps:
      - uses: actions/checkout@v4

      # rproxy-api と同じ名前のブランチがあればそれを、なければ既定ブランチを使う
      - name: pick rproxy-api ref
        id: rproxy
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/max3584/rproxy-api.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: max3584/rproxy-api
          ref: ${{ steps.rproxy.outputs.ref }}
          path: rproxy-api
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rproxy-api
      - name: build rproxy-api (${{ steps.rproxy.outputs.ref }})
        run: cargo build --manifest-path rproxy-api/Cargo.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: create tables from db/schema.sql
        run: |
          node -e "
            const fs = require('fs');
            require('mariadb').createConnection({
              host: process.env.DB_HOST, port: +process.env.DB_PORT, database: process.env.DB_DATABASE,
              user: process.env.DB_USER, password: process.env.DB_PASSWORD, multipleStatements: true,
            }).then(async (c) => { await c.query(fs.readFileSync('db/schema.sql', 'utf8')); await c.end(); });
          "

      - name: start rproxy-api
        run: |
          echo "$RPROXY_API_TOKEN" > "$RUNNER_TEMP/tokens"
          RPROXY_API_PORT=8080 RPROXY_TOKEN_FILE="$RUNNER_TEMP/tokens" \
          RPROXY_DATABASE_URL="mysql://$DB_USER:$DB_PASSWORD@$DB_HOST:$DB_PORT/$DB_DATABASE" \
            nohup rproxy-api/target/debug/rproxy-api > "$RUNNER_TEMP/rproxy.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/rproxy.log"; exit 1

      - name: e2e tests
        run: RUN_E2E=1 npx vitest run tests/e2e.test.ts

      # 画面操作（tests/ui）: 同じ MariaDB と rproxy-api を使う
      - name: Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: UI tests (Playwright)
        run: npx playwright test
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

      - name: rproxy-api log
        if: always()
        run: cat "$RUNNER_TEMP/rproxy.log" || true

  # 複数のノード（#98）：rproxy-api を 2 台（それぞれ別のコンテナ。同じ待ち受けを両方で使えるように）動かし、
  # ノードごとのデータベースのビュー（db/node-view.mjs）から起動時に自分のルールだけを戻すことを確かめる
  e2e-nodes:
    name: e2e (two rproxy nodes + group)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: rproxy_e2e
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rproxy_e2e
      DB_USER: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: pick rproxy-api ref
        id: rproxy
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/max3584/rproxy-api.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: max3584/rproxy-api
          ref: ${{ steps.rproxy.outputs.ref }}
          path: rproxy-api
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rproxy-api
      - name: build rproxy-api (${{ steps.rproxy.outputs.ref }})
        run: cargo build --manifest-path rproxy-api/Cargo.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: create tables from db/schema.sql
        run: docker exec -i ${{ job.services.mariadb.id }} mariadb -uroot -proot rproxy_e2e < db/schema.sql

      - name: create the per-node databases and views (db/node-view.mjs)
        run: |
          for n in n1 n2; do
            node db/node-view.mjs "$n" --database rproxy_e2e --host '%' --password "pw-$n"
          done | tee /dev/stderr | docker exec -i ${{ job.services.mariadb.id }} mariadb -uroot -proot

      - name: start two rproxy-api nodes (Unix sockets)
        run: |
          for n in n1 n2; do
            mkdir -p "$RUNNER_TEMP/$n"
            echo "token-$n" > "$RUNNER_TEMP/$n/tokens"
            docker run -d --name "rproxy-$n" --user "$(id -u):$(id -g)" --add-host=host.docker.internal:host-gateway \
              -v "$PWD/rproxy-api/target/debug/rproxy-api:/usr/local/bin/rproxy-api:ro" -v "$RUNNER_TEMP/$n:/run/rproxy" \
              -e RPROXY_API_PORT=0 -e RPROXY_API_SOCKET=/run/rproxy/api.sock -e RPROXY_TOKEN_FILE=/run/rproxy/tokens \
              -e RPROXY_DATABASE_URL="mysql://rproxy_$n:pw-$n@host.docker.internal:3306/rproxy_node_$n" \
              ubuntu:24.04 rproxy-api
          done
          cat > "$RUNNER_TEMP/nodes.yaml" <<YAML
          nodes:
            - name: n1
              url: unix:$RUNNER_TEMP/n1/api.sock
              token_file: $RUNNER_TEMP/n1/tokens
            - name: n2
              url: unix:$RUNNER_TEMP/n2/api.sock
              token_file: $RUNNER_TEMP/n2/tokens
          groups:
            - name: ha
              nodes: [n1, n2]
              mode: active_standby
          YAML
          echo "RPROXY_UI_NODES=$RUNNER_TEMP/nodes.yaml" >> "$GITHUB_ENV"
          for n in n1 n2; do
            ok=
            for i in $(seq 1 30); do
              if curl -sf --unix-socket "$RUNNER_TEMP/$n/api.sock" http://localhost/healthz; then ok=1; break; fi
              sleep 1
            done
            if [ -z "$ok" ]; then docker logs "rproxy-$n"; exit 1; fi
          done

      - name: e2e tests (nodes)
        run: RUN_E2E_NODES=1 E2E_NODE_CONTAINERS=n1=rproxy-n1,n2=rproxy-n2 npx vitest run tests/e2e-nodes.test.ts

      - name: rproxy-api logs
        if: always()
        run: |
          docker logs rproxy-n1 || true
          docker logs rproxy-n2 || true
