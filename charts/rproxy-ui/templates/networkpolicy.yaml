{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rproxy-ui.fullname" . }}
  labels: {{- include "rproxy-ui.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rproxy-ui.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 3000, protocol: TCP}
      {{- with .Values.networkPolicy.ingressFrom }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.mariadb.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rproxy-ui.mariadbName" . }}
  labels: {{- include "rproxy-ui.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "rproxy-ui.mariadbSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # this release's UI, migration and backup pods only
    - from:
        - podSelector:
            matchLabels: {{- include "rproxy-ui.selectorLabels" . | nindent 14 }}
      ports:
        - {port: 3306, protocol: TCP}
{{- end }}
{{- end }}
